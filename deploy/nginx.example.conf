map $uri $myexpenses_cache_control {
    default "no-store";
    ~^/assets/(?:[^/]+/)*[^/]+-[A-Za-z0-9_-]+\.[A-Za-z0-9]+$ "public, max-age=31536000, immutable";
}

server {
    listen 443 ssl http2;
    server_name finances.example.com;

    # Configure the certificate with your ACME/client tooling.
    ssl_certificate /etc/letsencrypt/live/finances.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finances.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/myexpenses/current;
    index index.html;
    autoindex off;
    server_tokens off;

    add_header Cache-Control $myexpenses_cache_control always;
    # React charts use inline style attributes for data-driven CSS variables.
    # CSP3 keeps style elements external while allowing only those attributes;
    # the style-src fallback preserves them in older CSP2 browsers.
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; style-src-elem 'self'; upgrade-insecure-requests; worker-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /data/app-dataset.vault.json {
        default_type application/json;
        limit_except GET {
            deny all;
        }
        try_files $uri =404;
    }

    location ^~ /assets/ {
        # Missing hashed assets must not fall back to index.html.
        try_files $uri =404;
    }

    location ~ (^|/)\. {
        deny all;
    }

    location / {
        limit_except GET {
            deny all;
        }
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name finances.example.com;
    return 308 https://finances.example.com$request_uri;
}
