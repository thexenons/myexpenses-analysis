pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $uri $myexpenses_cache_control {
        default "no-store";
        ~^/assets/(?:[^/]+/)*[^/]+-[A-Za-z0-9_-]+\.[A-Za-z0-9]+$ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        server_name _;
        root /srv/myexpenses/current;
        index index.html;
        autoindex off;
        server_tokens off;

        add_header Cache-Control $myexpenses_cache_control always;
        # React charts use inline style attributes for data-driven CSS variables.
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; style-src-elem 'self'; upgrade-insecure-requests; worker-src 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        location = /data/app-dataset.vault.json {
            default_type application/json;
            limit_except GET { deny all; }
            try_files $uri =404;
        }

        location ^~ /data/ {
            return 404;
        }

        location ^~ /assets/ {
            try_files $uri =404;
        }

        location ~ (^|/)\. {
            deny all;
        }

        location / {
            limit_except GET { deny all; }
            try_files $uri $uri/ /index.html;
        }
    }
}
